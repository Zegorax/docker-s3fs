name: Release docker-s3fs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PLUGIN_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set version number in config.json
        shell: bash
        run: |
          sed -i "s/vDEV/v${{ env.TAG }}/g" src/config.json

      - name: Build and push plugin
        shell: bash
        env:
          PLUGIN_PREFIX: ${{ env.PLUGIN_PREFIX }}
          TAG: ${{ env.TAG }}
        run: |
          export TAG
          export PLUGIN_PREFIX
          ./build-all.sh "$TAG"
          ./build-all.sh latest
